[project]
name = "cat-cam"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.2.2",
    "moderngl>=5.13.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "pynput>=1.8.2",
    "pyobjc-framework-avfoundation>=13.0 ; sys_platform == 'darwin'",
    "pyvirtualcam>=0.15.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
prepare = [
    "rembg[cpu]>=2.0.86",
]

[project.scripts]
cat-cam = "catcam.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catcam"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gl: needs an OpenGL context"]
